name: Update Wakatime Stats

on:
  schedule:
    # Runs at 00:00, only on Sunday.
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  update-readme:
    name: Update README with Wakatime Stats
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_OS: "False"
          SHOW_PROJECTS: "False"
